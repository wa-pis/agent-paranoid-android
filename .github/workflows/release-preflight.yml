name: Release artifact preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  build:
    name: Build candidate artifacts without publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact candidate source
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD^{commit})" = "${CANDIDATE_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked release environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Run release gate
        run: uv run --no-sync scripts/check_release.sh

      - name: Build candidate distributions
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${CANDIDATE_COMMIT}")"
          export SOURCE_DATE_EPOCH
          uv build --no-build-isolation
          sha256sum dist/*.whl dist/*.tar.gz > dist/ARTIFACT_SHA256

      - name: Verify installed wheel
        run: |
          uv run --isolated --no-project --with ./dist/*.whl python scripts/check_installed_package.py
          uv run --isolated --no-project --with ./dist/*.whl test-data-agent doctor --skip-smoke

      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preflight-${{ inputs.commit }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/ARTIFACT_SHA256
          if-no-files-found: error
          retention-days: 14
