name: Containers

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git show "${TRUSTED_SHA}:scripts/classify_ci_changes.py" \
            > "${RUNNER_TEMP}/classify_ci_changes.py"
          python3 "${RUNNER_TEMP}/classify_ci_changes.py" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate ${{ matrix.target }}
    needs:
      - changes
      - release-gate
    if: >-
      always() &&
      needs.changes.outputs.code == 'true' &&
      (!startsWith(github.ref, 'refs/tags/') ||
      needs.release-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - cli
          - generator-mcp
          - trino-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read package version
        id: package
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build local target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: agent-paranoid-android:${{ matrix.target }}-test
          build-args: |
            APP_VERSION=${{ steps.package.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Verify hardened runtime and health check
        env:
          IMAGE: agent-paranoid-android:${{ matrix.target }}-test
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "${IMAGE}")" != "null"
          trino_args=()
          if [[ "${TARGET}" == "trino-mcp" ]]; then
            trino_args=(
              --env TRINO_HOST=trino.example.test
              --env TRINO_PORT=443
              --env TRINO_USER=container_check
              --env TRINO_HTTP_SCHEME=https
              --env TRINO_ALLOWED_CATALOGS=example
              --env TRINO_ALLOWED_SCHEMAS=synthetic
            )
          fi
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /workspace:size=16m,nosuid,nodev,uid=65532,gid=65532 \
            "${trino_args[@]}" \
            --entrypoint python \
            "${IMAGE}" \
            -m test_data_agent.container_health "${TARGET}"

      - name: Scan image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-paranoid-android:${{ matrix.target }}-test
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  validate-arm64:
    name: Validate ARM64 ${{ matrix.target }}
    needs:
      - changes
      - release-gate
    if: >-
      always() &&
      needs.changes.outputs.code == 'true' &&
      (!startsWith(github.ref, 'refs/tags/') ||
      needs.release-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - cli
          - generator-mcp
          - trino-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read package version
        id: package
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build ARM64 target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: agent-paranoid-android:${{ matrix.target }}-arm64-test
          build-args: |
            APP_VERSION=${{ steps.package.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-arm64

      - name: Verify ARM64 runtime and health check
        env:
          IMAGE: agent-paranoid-android:${{ matrix.target }}-arm64-test
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' "${IMAGE}")" = "arm64"
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "${IMAGE}")" != "null"
          trino_args=()
          if [[ "${TARGET}" == "trino-mcp" ]]; then
            trino_args=(
              --env TRINO_HOST=trino.example.test
              --env TRINO_PORT=443
              --env TRINO_USER=container_check
              --env TRINO_HTTP_SCHEME=https
              --env TRINO_ALLOWED_CATALOGS=example
              --env TRINO_ALLOWED_SCHEMAS=synthetic
            )
          fi
          docker run --rm \
            --platform linux/arm64 \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /workspace:size=16m,nosuid,nodev,uid=65532,gid=65532 \
            "${trino_args[@]}" \
            --entrypoint python \
            "${IMAGE}" \
            -m test_data_agent.container_health "${TARGET}"

  release-gate:
    name: Verify release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify signed accepted release source
        env:
          RELEASE_ACCEPTED_COMMIT: ${{ vars.RELEASE_ACCEPTED_COMMIT }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ACCEPTED_COMMIT:-}" =~ ^[0-9a-f]{40}$ ]]
          git show "${RELEASE_ACCEPTED_COMMIT}:scripts/check_release_identity.py" \
            > "${RUNNER_TEMP}/check_release_identity.py"
          git show "${RELEASE_ACCEPTED_COMMIT}:scripts/check_release_acceptance.py" \
            > "${RUNNER_TEMP}/check_release_acceptance.py"
          git show "${RELEASE_ACCEPTED_COMMIT}:.github/release-signers" \
            > "${RUNNER_TEMP}/release-signers"
          python3 "${RUNNER_TEMP}/check_release_identity.py" \
            "${GITHUB_REF_NAME}" \
            "${RELEASE_ACCEPTED_COMMIT}" \
            "${RUNNER_TEMP}/release-signers"
          python3 "${RUNNER_TEMP}/check_release_acceptance.py" \
            "${GITHUB_REF_NAME}" \
            "${RELEASE_ACCEPTED_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked release environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Verify tag and release gate
        run: |
          uv run --no-sync python scripts/check_release_tag.py "${GITHUB_REF_NAME}"
          uv run --no-sync scripts/check_release.sh

  publish:
    name: Publish ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - validate-arm64
      - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            image: agent-paranoid-android-cli
          - target: generator-mcp
            image: agent-paranoid-android-generator-mcp
          - target: trino-mcp
            image: agent-paranoid-android-trino-mcp
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        run: python3 scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major=${version%%.*}" >> "${GITHUB_OUTPUT}"
          remainder="${version#*.}"
          echo "major_minor=${version%%.*}.${remainder%%.*}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=raw,value=${{ steps.package.outputs.major_minor }},enable=${{ steps.package.outputs.stable }}
            type=raw,value=${{ steps.package.outputs.major }},enable=${{ steps.package.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.package.outputs.stable }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify container version matches package
        run: python3 scripts/check_container_version.py "${{ steps.metadata.outputs.version }}"

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: >-
          cosign verify
          --certificate-identity
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/containers.yml@${GITHUB_REF}"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          "${IMAGE}@${DIGEST}"
