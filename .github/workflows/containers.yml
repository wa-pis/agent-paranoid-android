name: Containers

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - cli
          - generator-mcp
          - trino-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read package version
        id: package
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build local target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: agent-paranoid-android:${{ matrix.target }}-test
          build-args: |
            APP_VERSION=${{ steps.package.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Verify hardened runtime and health check
        env:
          IMAGE: agent-paranoid-android:${{ matrix.target }}-test
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "${IMAGE}")" != "null"
          trino_args=()
          if [[ "${TARGET}" == "trino-mcp" ]]; then
            trino_args=(
              --env TRINO_HOST=trino.example.test
              --env TRINO_PORT=443
              --env TRINO_USER=container_check
              --env TRINO_HTTP_SCHEME=https
              --env TRINO_ALLOWED_CATALOGS=example
              --env TRINO_ALLOWED_SCHEMAS=synthetic
            )
          fi
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /workspace:size=16m,nosuid,nodev,uid=65532,gid=65532 \
            "${trino_args[@]}" \
            --entrypoint python \
            "${IMAGE}" \
            -m test_data_agent.container_health "${TARGET}"

  release-gate:
    name: Verify release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Install locked release environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Verify tag and release gate
        run: |
          uv run --no-sync python scripts/check_release_tag.py "${GITHUB_REF_NAME}"
          uv run --no-sync scripts/check_release.sh

  publish:
    name: Publish ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            image: agent-paranoid-android-cli
          - target: generator-mcp
            image: agent-paranoid-android-generator-mcp
          - target: trino-mcp
            image: agent-paranoid-android-trino-mcp
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        run: python3 scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: >-
          cosign verify
          --certificate-identity
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/containers.yml@${GITHUB_REF}"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          "${IMAGE}@${DIGEST}"
