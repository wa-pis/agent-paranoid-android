name: Cloudflare documentation PR preview

on:
  workflow_run:
    workflows: [Documentation]
    types: [completed]

permissions:
  contents: read

jobs:
  inspect:
    name: Bind completed source run to an open exact-head PR
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      pr_number: ${{ steps.source.outputs.pr_number }}
      source_success: ${{ steps.source.outputs.source_success }}
    steps:
      - name: Check out trusted default-branch verifier only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate API provenance and current PR association
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          gh api "repos/wa-pis/agent-paranoid-android/actions/runs/$SOURCE_RUN_ID" \
            --jq '{id,status,conclusion,event,head_sha,path,repository:.repository.full_name,head_repository:.head_repository.full_name}' > source-run.json
          python3 -m scripts.cloudflare_previews run --metadata source-run.json --run-id "$SOURCE_RUN_ID" > source-head.txt
          SOURCE_SHA=$(sed -n 's/^source_sha=//p' source-head.txt)
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/wa-pis/agent-paranoid-android/commits/$SOURCE_SHA/pulls" \
            --jq '[.[]|{number,state,head_sha:.head.sha,head_repository:.head.repo.full_name,base_repository:.base.repo.full_name}]' > source-pulls.json
          python3 -m scripts.cloudflare_previews source --metadata source-run.json --pulls source-pulls.json --run-id "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

  source-failure:
    name: Report failed source without publication access
    needs: inspect
    if: needs.inspect.outputs.source_success == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the exact source head failed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          gh api --silent --method POST "repos/wa-pis/agent-paranoid-android/statuses/$SOURCE_SHA" \
            -f context=docs/cloudflare-preview -f state=failure \
            -f description='Documentation source failed; no preview was published' -f target_url="$RUN_URL"
          exit 1

  publish:
    name: Publish isolated static preview with trusted code only
    needs: inspect
    if: needs.inspect.outputs.source_success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pr-${{ needs.inspect.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    environment: cloudflare-pages-preview
    env:
      SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PREVIEW_PROJECT }}
      NORMAL_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check out trusted default-branch publication code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate isolated destination and mark pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CF_ACCOUNT" =~ ^[a-f0-9]{32}$ ]]
          [[ "$CF_PROJECT" = agent-paranoid-android-previews ]]
          [[ "$CF_PROJECT" != "$NORMAL_PROJECT" ]]
          gh api --silent --method POST "repos/wa-pis/agent-paranoid-android/statuses/$SOURCE_SHA" \
            -f context=docs/cloudflare-preview -f state=pending \
            -f description='Preparing isolated static preview'
      - name: Download static source data without executing it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-pr-preview
          path: preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Reject backends, configuration, symlinks, limits and false identities
        run: |
          python3 -m scripts.cloudflare_previews prepare preview-site --sha "$SOURCE_SHA"
          mkdir cloudflare-upload
      - name: Revalidate the current PR head immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/wa-pis/agent-paranoid-android/pulls/$PR_NUMBER" --jq 'select(.state=="open")|.head.sha')
          [[ "$CURRENT_SHA" = "$SOURCE_SHA" ]]
      - name: Set up pinned uploader runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Upload only to the isolated preview project and PR branch
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: npm
          workingDirectory: cloudflare-upload
          command: >-
            pages deploy ../preview-site --project-name=${{ vars.CLOUDFLARE_PAGES_PREVIEW_PROJECT }}
            --branch=pr-${{ needs.inspect.outputs.pr_number }} --commit-hash=${{ needs.inspect.outputs.source_sha }}
      - name: Verify exact preview bytes, identity, bilingual search and noindex
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: python3 -m scripts.cloudflare_previews verify preview-site --sha "$SOURCE_SHA" --url "$PREVIEW_URL"
      - name: Report exact-head publication status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          STATE=failure
          TARGET_URL="$RUN_URL"
          if [[ "$RESULT" = success ]]; then STATE=success; TARGET_URL="$PREVIEW_URL"; fi
          gh api --silent --method POST "repos/wa-pis/agent-paranoid-android/statuses/$SOURCE_SHA" \
            -f context=docs/cloudflare-preview -f state="$STATE" \
            -f description='Isolated documentation preview publication' -f target_url="$TARGET_URL"
