name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize complete main publications, including mike state retention.
concurrency:
  group: docs-publication-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked documentation environment
        run: uv sync --frozen --group docs --extra dev --python python --no-install-project

      - name: Verify documentation dependency licenses
        run: uv run --no-sync python scripts/check_dependency_licenses.py

      - name: Check documentation contracts
        run: uv run --no-sync pytest tests/test_documentation.py tests/test_documentation_build.py tests/test_readthedocs_build.py tests/test_documentation_edition_verification.py -q

      - name: Build documentation with strict validation
        run: uv run --no-sync mkdocs build --strict

      - name: Exercise parallel host editions without deployment
        env:
          READTHEDOCS_VERSION_TYPE: branch
          READTHEDOCS_GIT_IDENTIFIER: main
          READTHEDOCS_GIT_COMMIT_HASH: ${{ github.sha }}
          READTHEDOCS_CANONICAL_URL: https://example.invalid/en/latest/
        run: |
          python -m pip install uv==0.11.23
          python -m uv run --no-sync playwright install --no-shell chromium
          python -m uv run --no-sync python -m scripts.build_readthedocs --output rtd-normal
          READTHEDOCS_VERSION_TYPE=external python -m uv run --no-sync python -m scripts.build_readthedocs --output rtd-preview

      - name: Preserve parallel edition build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parallel-documentation-identities
          path: |
            rtd-normal/documentation.json
            rtd-normal/downloads/documentation.json
            rtd-preview/documentation.json
          if-no-files-found: error
          retention-days: 90

      - name: Build versioned documentation and offline formats
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-sync python -m scripts.build_documentation
          --output site --verify-release --state-bundle site.bundle

      - name: Preserve native mike publication state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-mike-state
          path: site.bundle
          if-no-files-found: error
          retention-days: 90

      - name: Read documentation identity
        id: identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = json.loads(Path("site/documentation.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("identity=" + json.dumps(identity) + "\n")
          PY

      - name: Preserve rendered documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 90

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify public documentation
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Wait for the public site
        env:
          DOCS_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_IDENTITY: ${{ needs.build.outputs.identity }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            if python3 -m scripts.verify_documentation \
              --url "${DOCS_URL}" --expected-json "${EXPECTED_IDENTITY}"; then
              echo "Versioned Agent Paranoid Android documentation is available."
              exit 0
            fi
            if [[ "${attempt}" -eq 15 ]]; then
              echo "Documentation did not become available at ${DOCS_URL}" >&2
              exit 1
            fi
            sleep 5
          done

  retain:
    name: Retain verified mike versions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download native mike state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-mike-state
          path: docs-state

      - name: Retain verified versions without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch docs-state/site.bundle gh-pages:refs/heads/docs-site-candidate
          git push origin refs/heads/docs-site-candidate:refs/heads/gh-pages
