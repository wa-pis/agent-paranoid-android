name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify signed accepted release source
        env:
          RELEASE_ACCEPTED_COMMIT: ${{ vars.RELEASE_ACCEPTED_COMMIT }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ACCEPTED_COMMIT:-}" =~ ^[0-9a-f]{40}$ ]]
          git show "${RELEASE_ACCEPTED_COMMIT}:scripts/check_release_identity.py" \
            > "${RUNNER_TEMP}/check_release_identity.py"
          git show "${RELEASE_ACCEPTED_COMMIT}:scripts/check_release_acceptance.py" \
            > "${RUNNER_TEMP}/check_release_acceptance.py"
          git show "${RELEASE_ACCEPTED_COMMIT}:.github/release-signers" \
            > "${RUNNER_TEMP}/release-signers"
          python3 "${RUNNER_TEMP}/check_release_identity.py" \
            "${GITHUB_REF_NAME}" \
            "${RELEASE_ACCEPTED_COMMIT}" \
            "${RUNNER_TEMP}/release-signers"
          python3 "${RUNNER_TEMP}/check_release_acceptance.py" \
            "${GITHUB_REF_NAME}" \
            "${RELEASE_ACCEPTED_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked release environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Verify tag matches package version
        run: uv run --no-sync python scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      - name: Run release gate
        run: uv run --no-sync scripts/check_release.sh

      - name: Build wheel and source distribution
        env:
          RELEASE_ACCEPTED_COMMIT: ${{ vars.RELEASE_ACCEPTED_COMMIT }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${RELEASE_ACCEPTED_COMMIT}")"
          export SOURCE_DATE_EPOCH
          uv build --no-build-isolation
          python3 "${RUNNER_TEMP}/check_release_acceptance.py" \
            "${GITHUB_REF_NAME}" \
            "${RELEASE_ACCEPTED_COMMIT}" \
            dist

      - name: Verify installed wheel
        run: |
          uv run --isolated --no-project --with ./dist/*.whl python scripts/check_installed_package.py
          uv run --isolated --no-project --with ./dist/*.whl test-data-agent doctor --skip-smoke

      - name: Export CycloneDX SBOM from lockfile
        run: >-
          uv export
          --frozen
          --no-dev
          --format cyclonedx1.5
          --preview-features sbom-export
          --quiet
          --output-file dist/sbom.cdx.json

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Export and verify portable build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "${PROVENANCE_BUNDLE}"
          bundle="dist/agent-paranoid-android-${GITHUB_REF_NAME#v}.sigstore.json"
          cp -- "${PROVENANCE_BUNDLE}" "${bundle}"
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "${artifact}" \
              --bundle "${bundle}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${GITHUB_REF_NAME}" \
              --deny-self-hosted-runners
          done

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json

      - name: Write artifact checksums
        run: >-
          sha256sum
          dist/*.whl
          dist/*.tar.gz
          dist/sbom.cdx.json
          dist/*.sigstore.json
          > dist/SHA256SUMS

      - name: Preserve release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download attested release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          make_latest: ${{ contains(github.ref_name, 'rc') && 'false' || 'true' }}

  publish-pypi:
    name: Request PyPI publication
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted PyPI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-pypi.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_TAG}" \
            --field "tag=${RELEASE_TAG}"
