name: Verify Published Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: verify-published-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve published release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Resolve immutable release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "release tag must use vX.Y.Z syntax" >&2
            exit 1
          fi
          test "$(git cat-file -t "${tag}")" = "tag"
          python3 scripts/check_release_tag.py "${tag}"
          published_tag="$(
            gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,tagName \
              --jq 'select(.isDraft == false) | .tagName'
          )"
          test "${published_tag}" = "${tag}"
          commit="$(git rev-list -n 1 "${tag}")"
          test "${commit}" = "$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Published release identity"
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  python-and-docs:
    name: Verify Python package and documentation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Download and verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets/dist /tmp/release-dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp/release-assets
          cp /tmp/release-assets/*.whl /tmp/release-assets/dist/
          cp /tmp/release-assets/*.tar.gz /tmp/release-assets/dist/
          cp /tmp/release-assets/sbom.cdx.json /tmp/release-assets/dist/
          (
            cd /tmp/release-assets
            sha256sum --check SHA256SUMS
          )
          cp /tmp/release-assets/dist/*.whl /tmp/release-dist/
          cp /tmp/release-assets/dist/*.tar.gz /tmp/release-dist/
          for artifact in /tmp/release-dist/*.whl /tmp/release-dist/*.tar.gz; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --deny-self-hosted-runners
          done
          {
            echo "## GitHub Release SHA-256"
            echo '```text'
            cat /tmp/release-assets/SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Match public PyPI hashes to GitHub Release
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 -m scripts.verify_pypi_release
          "${PYPI_VERSION}"
          /tmp/release-dist
          /tmp/public-package-requirement.txt

      - name: Install exact public package
        run: |
          set -euo pipefail
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/runtime-requirements.txt
          python3 -m venv /tmp/published-release
          /tmp/published-release/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --requirement /tmp/runtime-requirements.txt
          /tmp/published-release/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --require-hashes \
            --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --requirement /tmp/public-package-requirement.txt

      - name: Run README quickstart from public wheel
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp
          test "$(
            /tmp/published-release/bin/python -c \
              'import test_data_agent; print(test_data_agent.__version__)'
          )" = "${PYPI_VERSION}"
          /tmp/published-release/bin/python \
            "${GITHUB_WORKSPACE}/scripts/check_installed_package.py"
          /tmp/published-release/bin/test-data-agent doctor
          /tmp/published-release/bin/test-data-agent demo \
            --output /tmp/published-release-demo
          /tmp/published-release/bin/python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("/tmp/published-release-demo/generation_manifest.json").read_text()
          )
          assert manifest["synthetic"] is True
          assert manifest["source_rows_copied"] is False
          assert manifest["validation_valid"] is True
          PY

      - name: Run public agent approval and audit verification
        run: |
          set -euo pipefail
          cd /tmp
          demo_source="$(
            /tmp/published-release/bin/python - <<'PY'
          from importlib.resources import files

          print(files("test_data_agent.resources").joinpath("demo_customers.csv"))
          PY
          )"
          test -f "${demo_source}"
          test ! -e /tmp/published-release-agent

          /tmp/published-release/bin/test-data-agent agent-plan \
            "${demo_source}" \
            --source-type csv \
            --table customers \
            --workspace /tmp/published-release-agent \
            --count 8 \
            --seed 12345 \
            --format csv \
            --json \
            > /tmp/published-agent-plan.json
          test ! -e /tmp/published-release-agent/generated
          /tmp/published-release/bin/test-data-agent agent-review \
            /tmp/published-release-agent \
            --json \
            > /tmp/published-agent-review.json
          reviewed_spec_sha256="$(
            /tmp/published-release/bin/python - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path("/tmp/published-agent-review.json").read_text())
          print(review["current_spec_sha256"])
          PY
          )"
          /tmp/published-release/bin/test-data-agent agent-approve \
            /tmp/published-release-agent \
            --reviewed-spec-sha256 "${reviewed_spec_sha256}" \
            --json \
            > /tmp/published-agent-approved.json

          export TEST_DATA_AGENT_AUDIT_LOG=/tmp/published-release-audit.jsonl
          export TEST_DATA_AGENT_AUDIT_HMAC_KEY="$(
            /tmp/published-release/bin/python - <<'PY'
          import base64
          import secrets

          print(base64.b64encode(secrets.token_bytes(32)).decode("ascii"))
          PY
          )"
          /tmp/published-release/bin/python - <<'PY'
          from test_data_agent.audit import audited_mcp_tool


          def published_smoke() -> None:
              return None


          audited_mcp_tool("generator-mcp", published_smoke)()
          PY
          /tmp/published-release/bin/test-data-agent audit-verify \
            "${TEST_DATA_AGENT_AUDIT_LOG}" \
            2> /tmp/published-audit-verification.txt
          grep -F "Audit log verified: 2 records" \
            /tmp/published-audit-verification.txt

          /tmp/published-release/bin/python - <<'PY'
          import json
          from pathlib import Path

          planned = json.loads(Path("/tmp/published-agent-plan.json").read_text())
          review = json.loads(Path("/tmp/published-agent-review.json").read_text())
          approved = json.loads(
              Path("/tmp/published-agent-approved.json").read_text()
          )
          manifest = json.loads(
              Path(
                  "/tmp/published-release-agent/generated/generation_manifest.json"
              ).read_text()
          )
          reviewed_hash = review["current_spec_sha256"]
          assert planned["phase"] == "awaiting_approval"
          assert planned["review"]["current_spec_sha256"] == reviewed_hash
          assert review["approval_required"] is True
          assert review["generation_performed"] is False
          assert approved["phase"] == "completed"
          assert approved["summary"]["validation_valid"] is True
          assert approved["summary"]["source_rows_copied"] is False
          assert (
              approved["approval_receipt"]["reviewed_spec_sha256"]
              == reviewed_hash
          )
          assert manifest["synthetic"] is True
          assert manifest["source_rows_copied"] is False
          assert manifest["validation_valid"] is True
          PY
          echo "Public agent approval and audit verification passed." \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify published documentation
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --proto '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --max-time 30 \
            https://wa-pis.github.io/agent-paranoid-android/ \
            --output /tmp/published-docs.html
          grep -F "quickstart smoke: ok" /tmp/published-docs.html
          grep -F "${PYPI_VERSION}" /tmp/published-docs.html

  public-install-profiles:
    name: Verify public install / ${{ matrix.profile }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            requirement: "agent-paranoid-android"
          - profile: trino
            requirement: "agent-paranoid-android[trino]"
          - profile: mcp
            requirement: "agent-paranoid-android[mcp]"
          - profile: mcp-trino
            requirement: "agent-paranoid-android[mcp,trino]"
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install exact public profile
        env:
          PACKAGE_REQUIREMENT: ${{ matrix.requirement }}
          PROFILE: ${{ matrix.profile }}
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          environment="/tmp/published-${PROFILE}"
          python3 -m venv "${environment}"
          "${environment}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --index-url https://pypi.org/simple \
            "${PACKAGE_REQUIREMENT}==${PYPI_VERSION}"
          "${environment}/bin/python" -m pip check

          source "${environment}/bin/activate"
          readme_workspace="/tmp/published-${PROFILE}-readme"
          mkdir -p "${readme_workspace}"
          cd "${readme_workspace}"
          test-data-agent doctor
          test-data-agent demo --output out/demo

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("out/demo/generation_manifest.json").read_text())
          assert manifest["synthetic"] is True
          assert manifest["source_rows_copied"] is False
          assert manifest["validation_valid"] is True
          PY

  containers:
    name: Verify ${{ matrix.target }} container
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            image: agent-paranoid-android-cli
          - target: generator-mcp
            image: agent-paranoid-android-generator-mcp
          - target: trino-mcp
            image: agent-paranoid-android-trino-mcp
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Resolve and verify immutable image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          inspection="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          digest="$(printf '%s\n' "${inspection}" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "${inspection}" | grep -F 'linux/amd64'
          printf '%s\n' "${inspection}" | grep -F 'linux/arm64'
          docker buildx imagetools inspect "${IMAGE}@${digest}" \
            --format '{{ json .SBOM }}' \
            > /tmp/sbom.json
          test -s /tmp/sbom.json
          test "$(tr -d '[:space:]' < /tmp/sbom.json)" != "null"
          cosign verify \
            --certificate-identity \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/containers.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${digest}"
          gh attestation verify "oci://${IMAGE}@${digest}" \
            --repo "${GITHUB_REPOSITORY}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Published container"
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Pull and run published image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}@${DIGEST}")" = "65532:65532"
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "${IMAGE}@${DIGEST}")" != "null"
          test "$(
            docker run --rm \
              --network none \
              --entrypoint python \
              "${IMAGE}@${DIGEST}" \
              -c 'from test_data_agent.version import __version__; print(__version__)'
          )" = "${VERSION}"
          trino_args=()
          if [[ "${TARGET}" == "trino-mcp" ]]; then
            trino_args=(
              --env TRINO_HOST=trino.example.test
              --env TRINO_PORT=443
              --env TRINO_USER=container_check
              --env TRINO_HTTP_SCHEME=https
              --env TRINO_ALLOWED_CATALOGS=example
              --env TRINO_ALLOWED_SCHEMAS=synthetic
            )
          fi
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /workspace:size=16m,nosuid,nodev,uid=65532,gid=65532 \
            "${trino_args[@]}" \
            --entrypoint python \
            "${IMAGE}@${DIGEST}" \
            -m test_data_agent.container_health "${TARGET}"
