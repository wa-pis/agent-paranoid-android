name: Cloudflare documentation parallel acceptance

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main-push Documentation run containing the retained site
        required: true
        type: string
      create_project:
        description: Create the configured Direct Upload project before its first parallel deployment
        required: true
        type: boolean
        default: false

      recovery:
        description: Rehearse production only in the separate derived recovery project
        required: true
        type: boolean
        default: false
      rejection:
        description: Deliberately reject a disposable copy in recovery mode only
        required: true
        type: choice
        options: [none, identity, hash]
        default: none

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-docs-parallel
  cancel-in-progress: false

jobs:
  parallel:
    name: Publish and verify parallel static documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-pages-preview
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check out trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate account selection and trusted source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$CF_ACCOUNT" =~ ^[a-f0-9]{32}$ ]]
          [[ "$CF_PROJECT" =~ ^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$ ]]
          gh api "repos/wa-pis/agent-paranoid-android/actions/runs/$SOURCE_RUN_ID" \
            --jq '{id, status, conclusion, event, head_branch, head_sha, path, repository: .repository.full_name, head_repository: .head_repository.full_name}' \
            > source-run.json
          python3 -m scripts.cloudflare_documentation source \
            --metadata source-run.json --run-id "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Select isolated destination and validate rehearsal controls
        id: target
        env:
          RECOVERY: ${{ inputs.recovery }}
          REJECTION: ${{ inputs.rejection }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY" = true || "$RECOVERY" = false ]]
          [[ "$REJECTION" = none || "$REJECTION" = identity || "$REJECTION" = hash ]]
          [[ "$REJECTION" = none || "$RECOVERY" = true ]]
          TARGET_ARGS=()
          if [[ "$RECOVERY" = true ]]; then TARGET_ARGS+=(--recovery); fi
          python3 -m scripts.cloudflare_documentation target --project "$CF_PROJECT" \
            --run-id "$SOURCE_RUN_ID" "${TARGET_ARGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Download only the validated rendered artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: cloudflare-site
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Exercise rejection only on a disposable recovery copy
        if: inputs.recovery && inputs.rejection != 'none'
        env:
          REJECTION: ${{ inputs.rejection }}
        run: python3 -m scripts.cloudflare_documentation exercise cloudflare-site --kind "$REJECTION"

      - name: Check static-only payload, all retained hashes and upload limits
        run: |
          set -euo pipefail
          python3 -m scripts.cloudflare_documentation prepare cloudflare-site
          mkdir cloudflare-upload

      - name: Set up pinned uploader runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Create the Direct Upload project only when explicitly selected
        if: inputs.create_project
        id: create
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: npm
          workingDirectory: cloudflare-upload
          command: >-
            pages project create ${{ steps.target.outputs.target_project }}
            --production-branch=main

      - name: Upload only the validated parallel or isolated recovery destination
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: npm
          workingDirectory: cloudflare-upload
          command: >-
            pages deploy ../cloudflare-site
            --project-name=${{ steps.target.outputs.target_project }}
            --branch=${{ steps.target.outputs.target_branch }}
            --commit-hash=${{ steps.source.outputs.source_sha }}

      - name: Compare every public edition against the retained same-build evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          python3 -m scripts.cloudflare_documentation verify cloudflare-site --url "$DEPLOYMENT_URL"
          echo "Destination bytes verified; no canonical or normal-project production promotion was performed."
