name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git show "${TRUSTED_SHA}:scripts/classify_ci_changes.py" \
            > "${RUNNER_TEMP}/classify_ci_changes.py"
          python3 "${RUNNER_TEMP}/classify_ci_changes.py" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            >> "${GITHUB_OUTPUT}"

  quality:
    name: Python ${{ matrix.python-version }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Skip heavy checks for documentation-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Documentation-only change; Python checks are not required."

      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked development environment
        if: needs.changes.outputs.code == 'true'
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Audit Python dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          uv export --quiet --frozen --all-extras --no-emit-project --output-file /tmp/audit-requirements.txt
          uv run --no-sync python -m pip_audit --require-hashes --requirement /tmp/audit-requirements.txt

      - name: Verify dependency licenses
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-sync python scripts/check_dependency_licenses.py

      - name: Run lint checks
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-sync python -m ruff check src tests

      - name: Run static type checks
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-sync python -m mypy

      - name: Compile source and tests
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-sync python -m compileall -q src tests

      - name: Run tests with coverage gate
        if: needs.changes.outputs.code == 'true'
        run: >-
          uv run --no-sync python -m pytest
          --cov=test_data_agent
          --cov-report=term-missing
          --cov-fail-under=85

  package:
    name: Wheel smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked build environment
        run: |
          uv sync --frozen --extra dev --python python --no-install-project
          uv sync --frozen --extra dev --python python --no-editable --no-build-isolation

      - name: Build wheel and source distribution
        run: uv build --no-build-isolation

      - name: Verify isolated base install and CSV/JSON quickstart
        run: |
          set -euo pipefail
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"

          uv run --isolated --no-project --with "${wheel_path}" \
            python scripts/check_installed_package.py \
            --profile base --wheel "${wheel_path}"
          uv run --isolated --no-project --with "${wheel_path}" \
            test-data-agent doctor

  package-optional:
    name: Optional wheel / ${{ matrix.profile }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [parquet, mcp, openai, gigachat, postgres, trino]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked build environment
        run: |
          uv sync --frozen --extra dev --python python --no-install-project
          uv sync --frozen --extra dev --python python --no-editable --no-build-isolation

      - name: Build wheel
        run: uv build --wheel --no-build-isolation

      - name: Verify isolated optional capability
        run: |
          set -euo pipefail
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          wheel_uri="file://${wheel_path}"

          uv run --isolated --no-project \
            --with "agent-paranoid-android[${{ matrix.profile }}] @ ${wheel_uri}" \
            python scripts/check_installed_package.py \
            --profile "${{ matrix.profile }}"
          uv run --isolated --no-project \
            --with "agent-paranoid-android[${{ matrix.profile }}] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra "${{ matrix.profile }}"

  package-compatibility:
    name: Wheel compatibility (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked build environment
        run: |
          uv sync --frozen --extra dev --python python --no-install-project
          uv sync --frozen --extra dev --python python --no-editable --no-build-isolation

      - name: Build and verify base wheel
        run: |
          uv build --wheel --no-build-isolation
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          uv run --isolated --no-project --with "${wheel_path}" \
            python scripts/check_installed_package.py \
            --profile base --wheel "${wheel_path}"
          uv run --isolated --no-project --with "${wheel_path}" \
            test-data-agent doctor
          wheel_uri="file://${wheel_path}"
          uv run --isolated --no-project \
            --with "agent-paranoid-android[gigachat] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile gigachat
          uv run --isolated --no-project \
            --with "agent-paranoid-android[gigachat] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra gigachat
          uv run --isolated --no-project \
            --with "agent-paranoid-android[all] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile all
          uv run --isolated --no-project \
            --with "agent-paranoid-android[all] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra all

  dependency-minimum:
    name: Minimum dependencies / ${{ matrix.profile }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            project-spec: ".[dev]"
            constraint-file: dependency-minimum.txt
            test-paths: >-
              tests/test_io_workflows.py
              tests/test_business_rules.py
          - profile: parquet
            project-spec: ".[dev,parquet]"
            constraint-file: dependency-minimum.txt
            test-paths: tests/test_io_commands.py
          - profile: mcp
            project-spec: ".[dev,mcp]"
            constraint-file: dependency-minimum-mcp.txt
            test-paths: >-
              tests/test_mcp_generator_transport.py
              tests/test_mcp_trino_transport.py
          - profile: trino
            project-spec: ".[dev,trino]"
            constraint-file: dependency-minimum.txt
            test-paths: tests/test_mcp_trino_server.py
          - profile: openai
            project-spec: ".[dev,openai]"
            constraint-file: dependency-minimum.txt
            test-paths: tests/test_openai_provider.py
          - profile: gigachat
            project-spec: ".[dev,gigachat]"
            constraint-file: dependency-minimum.txt
            test-paths: tests/test_gigachat_provider.py
          - profile: postgres
            project-spec: ".[dev,postgres]"
            constraint-file: dependency-minimum.txt
            test-paths: >-
              tests/test_postgres_config.py
              tests/test_postgres_client.py
              tests/test_postgres_query_builders.py
              tests/test_postgres_profiler.py
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install exact minimum profile
        run: |
          uv venv --python python
          uv pip install --python .venv/bin/python \
            --constraint '.github/constraints/${{ matrix.constraint-file }}' \
            --editable '${{ matrix.project-spec }}'

      - name: Run dependency contract tests
        run: .venv/bin/python -m pytest ${{ matrix.test-paths }}

  trino-integration:
    name: Trino integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      trino:
        image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
        ports:
          - 8080:8080
        options: >-
          --health-cmd /usr/lib/trino/bin/health-check
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_TRINO_INTEGRATION: "1"
      TRINO_HOST: localhost
      TRINO_PORT: "8080"
      TRINO_USER: integration_test
      TRINO_HTTP_SCHEME: http
      TRINO_ALLOW_INSECURE_HTTP: "true"
      TRINO_ALLOWED_CATALOGS: tpch
      TRINO_ALLOWED_SCHEMAS: tiny
      TRINO_REQUEST_TIMEOUT_SECONDS: "30"
      TRINO_MAX_RESULT_ROWS: "100"
      TRINO_QUERY_MAX_EXECUTION_TIME: 30s
      TRINO_QUERY_MAX_RUN_TIME: 45s
      TRINO_QUERY_MAX_SCAN_PHYSICAL_BYTES: 64MB
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked development environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Run live Trino integration tests
        run: >-
          uv run --no-sync python -m pytest
          -m integration
          tests/integration/test_trino_integration.py
