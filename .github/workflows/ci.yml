name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked development environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Audit Python dependencies
        run: |
          uv export --quiet --frozen --all-extras --no-emit-project --output-file /tmp/audit-requirements.txt
          uv run --no-sync python -m pip_audit --require-hashes --requirement /tmp/audit-requirements.txt

      - name: Verify dependency licenses
        run: uv run --no-sync python scripts/check_dependency_licenses.py

      - name: Run lint checks
        run: uv run --no-sync python -m ruff check src tests

      - name: Run static type checks
        run: uv run --no-sync python -m mypy

      - name: Compile source and tests
        run: uv run --no-sync python -m compileall -q src tests

      - name: Run tests with coverage gate
        run: >-
          uv run --no-sync python -m pytest
          --cov=test_data_agent
          --cov-report=term-missing
          --cov-fail-under=85

  package:
    name: Wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked build environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Build wheel and source distribution
        run: uv build --no-build-isolation

      - name: Verify isolated install profiles
        run: |
          set -euo pipefail
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          wheel_uri="file://${wheel_path}"

          uv run --isolated --no-project --with "${wheel_path}" \
            python scripts/check_installed_package.py \
            --profile base --wheel "${wheel_path}"
          uv run --isolated --no-project --with "${wheel_path}" \
            test-data-agent doctor --skip-smoke

          uv run --isolated --no-project \
            --with "agent-paranoid-android[parquet] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile parquet
          uv run --isolated --no-project \
            --with "agent-paranoid-android[parquet] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra parquet

          uv run --isolated --no-project \
            --with "agent-paranoid-android[mcp] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile mcp
          uv run --isolated --no-project \
            --with "agent-paranoid-android[mcp] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra mcp

          uv run --isolated --no-project \
            --with "agent-paranoid-android[openai] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile openai
          uv run --isolated --no-project \
            --with "agent-paranoid-android[openai] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra openai

          uv run --isolated --no-project \
            --with "agent-paranoid-android[trino] @ ${wheel_uri}" \
            python scripts/check_installed_package.py --profile trino
          uv run --isolated --no-project \
            --with "agent-paranoid-android[trino] @ ${wheel_uri}" \
            test-data-agent doctor --require-extra trino

  package-compatibility:
    name: Wheel compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked build environment
        run: |
          uv sync --frozen --extra dev --python python --no-install-project
          uv sync --frozen --extra dev --python python --no-editable --no-build-isolation

      - name: Build and verify base wheel
        run: |
          uv build --wheel --no-build-isolation
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          uv run --isolated --no-project --with "${wheel_path}" \
            python scripts/check_installed_package.py \
            --profile base --wheel "${wheel_path}"
          uv run --isolated --no-project --with "${wheel_path}" \
            test-data-agent doctor

  trino-integration:
    name: Trino integration
    runs-on: ubuntu-latest
    services:
      trino:
        image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
        ports:
          - 8080:8080
        options: >-
          --health-cmd /usr/lib/trino/bin/health-check
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_TRINO_INTEGRATION: "1"
      TRINO_HOST: localhost
      TRINO_PORT: "8080"
      TRINO_USER: integration_test
      TRINO_HTTP_SCHEME: http
      TRINO_ALLOW_INSECURE_HTTP: "true"
      TRINO_ALLOWED_CATALOGS: tpch
      TRINO_ALLOWED_SCHEMAS: tiny
      TRINO_REQUEST_TIMEOUT_SECONDS: "30"
      TRINO_MAX_RESULT_ROWS: "100"
      TRINO_QUERY_MAX_EXECUTION_TIME: 30s
      TRINO_QUERY_MAX_RUN_TIME: 45s
      TRINO_QUERY_MAX_SCAN_PHYSICAL_BYTES: 64MB
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          prune-cache: true

      - name: Install locked development environment
        run: |
          uv sync --frozen --all-extras --python python --no-install-project
          uv sync --frozen --all-extras --python python --no-editable --no-build-isolation

      - name: Run live Trino integration tests
        run: >-
          uv run --no-sync python -m pytest
          -m integration
          tests/integration/test_trino_integration.py
