strict: true
site_name: Agent Paranoid Android
site_description: Reproducible synthetic test data for CSV and database workflows
site_url: https://wa-pis.github.io/agent-paranoid-android/
repo_url: https://github.com/wa-pis/agent-paranoid-android
repo_name: wa-pis/agent-paranoid-android
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: false
  custom_dir: docs/theme

hooks:
  - scripts/documentation_hooks.py

plugins:
  - search:
      lang: [en, ru]
  - mike:
      alias_type: copy
      deploy_prefix: versions
      version_selector: false
  - print-site:
      print_page_title: User Handbook / Руководство пользователя
      print_page_basename: handbook
      add_cover_page: false
      add_table_of_contents: false
      toc_depth: 2
      enumerate_headings: false
      exclude:
        - history.md
        - downloads.md
        - versions.md
        - roadmap.md
        - ru/history.md
        - ru/downloads.md
        - ru/versions.md
        - ru/roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

exclude_docs: |
  implementation_map.md
  theme/

extra_css:
  - stylesheets/handbook.css

nav:
  - Start Here:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - First CSV Dataset: getting-started/first-csv.md
      - Related Tables: getting-started/related-tables.md
      - Review The Output: getting-started/review-output.md
  - How-To Guides:
      - Add Business Rules: how-to/business-rules.md
      - Profile PostgreSQL: how-to/postgresql.md
      - Profile Through Trino: how-to/trino.md
      - Transform Local Data: how-to/transformation.md
  - Integrations:
      - Connect An MCP Client: how-to/mcp.md
      - Connect An AI Client: ai_integration.md
      - Containers: operations/containers.md
  - Reference:
      - Reference Index: reference/index.md
      - Choose An Approach: concepts/choosing-an-approach.md
      - Profiles And Specs: concepts/profiles-and-specs.md
      - Safety Model: concepts/safety-model.md
  - Help:
      - Troubleshooting: operations/troubleshooting.md
      - Known Issues: known-issues.md
  - Documentation:
      - Downloads: downloads.md
      - Versions: versions.md
      - Roadmap: roadmap.md
  - History And Maintenance: history.md
  - Русский:
      - Начало:
        - Обзор: ru/index.md
        - Установка: ru/getting-started/installation.md
        - Первый набор CSV: ru/getting-started/first-csv.md
        - Связанные таблицы: ru/getting-started/related-tables.md
        - Проверить результат: ru/getting-started/review-output.md
      - Инструкции:
        - Бизнес-правила: ru/how-to/business-rules.md
        - Профилирование PostgreSQL: ru/how-to/postgresql.md
        - Профилирование Trino: ru/how-to/trino.md
        - Трансформация локальных данных: ru/how-to/transformation.md
      - Интеграции:
        - MCP-клиент: ru/how-to/mcp.md
        - AI-клиент: ru/ai_integration.md
        - Контейнеры: ru/operations/containers.md
      - Справочник:
        - Индекс справочника: ru/reference/index.md
        - Выбрать подход: ru/concepts/choosing-an-approach.md
        - Профили и спецификации: ru/concepts/profiles-and-specs.md
        - Модель безопасности: ru/concepts/safety-model.md
      - Помощь:
        - Диагностика: ru/operations/troubleshooting.md
        - Известные проблемы: ru/known-issues.md
      - Документация:
        - Скачать: ru/downloads.md
        - Версии: ru/versions.md
        - Дорожная карта: ru/roadmap.md
      - История и сопровождение: ru/history.md
