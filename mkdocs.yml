site_name: Agent Paranoid Android
site_description: Reproducible synthetic test data for CSV and database workflows
site_url: https://wa-pis.github.io/agent-paranoid-android/
repo_url: https://github.com/wa-pis/agent-paranoid-android
repo_name: wa-pis/agent-paranoid-android
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

exclude_docs: |
  implementation_map.md

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Product Validation Pilot: getting-started/product-validation-pilot.md
      - First CSV Dataset: getting-started/first-csv.md
      - Related Tables: getting-started/related-tables.md
      - Review The Output: getting-started/review-output.md
  - How-To Guides:
      - Add Business Rules: how-to/business-rules.md
      - Profile PostgreSQL: how-to/postgresql.md
      - Profile Through Trino: how-to/trino.md
  - Integrations:
      - Connect An MCP Client: how-to/mcp.md
      - Connect An AI Client: ai_integration.md
      - Use The GigaChat Advisor: how-to/gigachat.md
      - Build A Provider Adapter: how-to/custom-advisor-provider.md
      - Build A Semantic Provider: how-to/custom-semantic-provider.md
      - Run The Reference Agent: how-to/reference-agent.md
  - Safety And Concepts:
      - Safety Model: concepts/safety-model.md
      - Threat Model: concepts/threat-model.md
      - Choose An Approach: concepts/choosing-an-approach.md
      - Profiles And Specs: concepts/profiles-and-specs.md
      - Relational Synthesis Contract: concepts/relational-synthesis-contract.md
      - DatasetSpec Compatibility: concepts/dataset-spec-compatibility.md
      - Dataset Workflow: domain_agnostic_workflow.md
  - Reference:
      - CLI Command Index: reference/cli.md
      - CLI Workflows: reference/cli-workflows.md
      - CLI Automation And JSON: reference/cli-automation.md
      - CLI Errors And Exit Codes: reference/cli-errors.md
      - Shell Completion: reference/shell-completion.md
      - Public Stability: reference/stability.md
      - Runtime And Integration Support: reference/support-policy.md
      - Dependency Compatibility: reference/dependency-compatibility.md
      - Compatibility Surfaces: reference/compatibility.md
      - Configuration: reference/configuration.md
      - DatasetSpec: dataset_profile_and_spec.md
      - Advisor API: reference/advisor.md
      - MCP Tools: mcp_examples.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
      - Known Issues: known-issues.md
      - Resource Budgets: operations/resource-budgets.md
      - MCP Audit Logging: operations/audit-logging.md
      - Container Deployment: operations/containers.md
  - Roadmap: roadmap.md
  - Maintainers:
      - Architecture: agent_design.md
      - Development: development.md
      - Release Process: release.md
      - Manual Release Runbook: manual-release-runbook.md
      - Release Evidence: release-evidence.md
      - Security Review History: security-history.md
      - OpenSpec Archive: openspec-archive.md
