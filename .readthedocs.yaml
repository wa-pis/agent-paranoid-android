version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Chromium dependencies from the locked Playwright Ubuntu 24.04 manifest.
  apt_packages:
    - fonts-dejavu-core
    - fonts-liberation
    - fonts-noto-color-emoji
    - libfontconfig1
    - libfreetype6
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  jobs:
    post_checkout:
      - git fetch origin 'refs/tags/*:refs/tags/*'
    create_environment:
      - python -m pip install uv==0.11.23
    install:
      - python -m uv sync --frozen --only-group docs --no-install-project
      - python -m uv run --no-sync python scripts/check_dependency_licenses.py
      - if [ "$READTHEDOCS_VERSION_TYPE" != "external" ]; then python -m uv run --no-sync playwright install --no-shell chromium; fi
    build:
      html:
        - if [ "$READTHEDOCS_VERSION_TYPE" = "external" ]; then python -c 'raise SystemExit("Fictional preview rejection: isolated failure rehearsal")'; fi
        - python -m uv run --no-sync python -m scripts.build_readthedocs --output "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
